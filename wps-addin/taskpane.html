<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>涉网试验报告助手</title><style>
*{box-sizing:border-box}body{font:14px "Microsoft YaHei",sans-serif;margin:0;background:#f5f7fa;color:#243447}.head{background:#12365b;color:#fff;padding:16px}.head h1{font-size:18px;margin:0}.head p{margin:5px 0 0;color:#c9ddf4;font-size:12px}.card{margin:12px;padding:12px;background:#fff;border:1px solid #dbe3ea;border-radius:5px}.row{display:flex;gap:7px;align-items:center;margin:8px 0}.row label{min-width:66px;color:#52616f}select,button{font:inherit;padding:7px;border-radius:3px}select{flex:1;border:1px solid #b8c7d5}button{background:#1666c5;color:#fff;border:0;cursor:pointer}button.alt{background:#5c6b78}button.warn{background:#a85a18}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.metric{padding:8px;background:#f6f9fc;border-radius:3px}.metric span{display:block;font-size:12px;color:#667788}.metric b{font-size:18px}.ok{color:#177546}.bad{color:#b3261e}.muted{color:#667788;font-size:12px;line-height:1.55}.details{white-space:pre-wrap;max-height:200px;overflow:auto;background:#f6f9fc;padding:8px}.doc{word-break:break-all}.mapping-list{margin-top:8px;max-height:180px;overflow:auto}.mapping-row{display:grid;grid-template-columns:minmax(76px,1fr) minmax(110px,2fr) auto;gap:6px;padding:6px 0;border-bottom:1px solid #edf1f5}.mapping-row span{word-break:break-all}.mapping-row em{font-style:normal;color:#667788;font-size:12px}
</style></head><body>
<div class="head"><h1>涉网试验报告助手</h1><p id="bridge">Bridge：连接中…</p></div>
<section class="card"><div class="row"><label>当前项目</label><select id="projects" onchange="loadProject()"><option>正在读取…</option></select></div><div class="row"><button onclick="refreshAll()">刷新状态</button><button class="alt" onclick="scan()">扫描</button><button class="alt" onclick="loadMappings()">字段映射</button></div></section>
<section class="card"><strong>字段映射</strong><div id="mappingList" class="mapping-list"><span class="muted">点击“字段映射”读取。</span></div><div class="row"><button class="alt" onclick="confirmAllMappings()">确认全部已有映射</button></div></section>
<section class="card"><div class="grid"><div class="metric"><span>资料</span><b id="files">--</b></div><div class="metric"><span>字段</span><b id="fields">--</b></div><div class="metric"><span>已匹配</span><b id="matched">--</b></div><div class="metric"><span>待确认</span><b id="pending">--</b></div><div class="metric"><span>错误</span><b id="errors">--</b></div><div class="metric"><span>模板</span><b id="template">--</b></div></div></section>
<section class="card"><strong>当前 WPS 文档</strong><p id="document" class="muted doc">正在检测…</p><div class="row"><button class="alt" onclick="setCurrentTemplate()">设为当前报告模板</button><button class="alt" onclick="defineFieldHelp()">定义报告字段</button></div><p class="muted">“定义报告字段”暂不通过 JS API 自动写入批注，避免伪造或破坏模板；请在 WPS 中手工选中占位文本后添加批注。</p></section>
<section class="card"><strong>报告操作</strong><div class="row"><button onclick="preflight()">报告校核</button><button class="warn" onclick="generate('draft')">生成草稿</button><button onclick="generate('formal')">生成正式报告</button></div><div id="message" class="details muted">等待操作。</div></section>
<script src="/wps/taskpane.js"></script></body></html>
